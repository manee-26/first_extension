<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World Extension</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <div class="icon-pulse"></div>
      <span class="icon">👋</span>
    </div>

    <h1 class="title">Hello, World!</h1>
    <p class="subtitle">Your first Chrome extension is working!</p>

    <div class="card">
      <p class="card-text">🎉 Congrats on building your first extension!</p>
    </div>

    <button class="btn" id="greetBtn">Say Hello Again</button>

    <p class="message" id="message"></p>

    <div class="footer">
      <span>Made with ❤️ by Maneeshareddy</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
